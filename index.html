<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2026년 월별 선적 일정 대시보드</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-base: #f0f9ff;
      --bg-surface: #ffffff;
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --secondary: #38bdf8;
      --accent: #06b6d4;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --glass-bg: rgba(255, 255, 255, 0.96);
      --glass-border: rgba(2, 132, 199, 0.2);
      --glass-shadow: 0 10px 30px -5px rgba(2, 132, 199, 0.1);

      /* 담당자 색상 팔레트 */
      --color-WK:  #0284c7;
      --color-TK:  #059669;
      --color-CHK: #d97706;
      --color-SM:  #7c3aed;
      --color-SH:  #dc2626;
      --color-default: #64748b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Outfit', 'Noto Sans KR', sans-serif;
      background-color: var(--bg-base);
      background-image:
        radial-gradient(circle at 10% 20%, rgba(56, 189, 248, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(6, 182, 212, 0.08) 0%, transparent 40%);
      color: var(--text-main);
      min-height: 100vh;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 50px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .header {
      text-align: center;
      margin-bottom: 50px;
      animation: fadeInDown 0.6s ease-out;
    }

    .title {
      font-size: 2.8rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -1px;
    }

    /* ── Dropzone ── */
    .dropzone-container {
      width: 100%;
      max-width: 700px;
      margin: 0 auto;
    }

    .dropzone {
      display: block;           /* block 명시 — 렌더링 분리 버그 방지 */
      background: var(--glass-bg);
      border: 3px dashed var(--secondary);
      border-radius: 24px;
      padding: 60px 30px;
      text-align: center;
      cursor: pointer;
      box-shadow: var(--glass-shadow);
      transition: all 0.3s ease;
      user-select: none;
    }

    .dropzone:hover, .dropzone.dragover {
      border-color: var(--primary);
      background: #ffffff;
      transform: translateY(-5px);
      box-shadow: 0 15px 35px rgba(2, 132, 199, 0.15);
    }

    .dropzone-icon { margin-bottom: 20px; }

    .dropzone-text {
      font-size: 1.35rem;
      font-weight: 700;
      margin-bottom: 10px;
      color: var(--primary);
    }

    .dropzone-subtext {
      font-size: 1rem;
      color: var(--text-muted);
    }

    /* ── 저장된 데이터 힌트 (업로드 화면) ── */
    .cached-hint {
      margin-top: 14px;
      padding: 14px 20px;
      background: rgba(2, 132, 199, 0.05);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      animation: fadeIn 0.4s ease-out;
    }

    .cached-hint-info {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.9rem;
      color: var(--text-muted);
      min-width: 0;
    }

    .cached-hint-info svg { flex-shrink: 0; color: var(--accent); }

    .cached-hint-name {
      font-weight: 700;
      color: var(--primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 260px;
    }

    .cached-hint-date { font-size: 0.8rem; white-space: nowrap; }

    .load-cached-btn {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      border: none;
      border-radius: 20px;
      padding: 9px 20px;
      color: white;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      transition: transform 0.2s, box-shadow 0.2s;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .load-cached-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(2, 132, 199, 0.3);
    }

    /* ── Dashboard ── */
    .dashboard-wrapper { width: 100%; }

    .dashboard-wrapper.fade-in { animation: fadeIn 0.5s ease-out; }

    /* 저장 정보 표시줄 */
    .save-info-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      padding: 8px 18px;
      background: rgba(2, 132, 199, 0.05);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    .save-info-bar svg { flex-shrink: 0; }

    .save-info-filename {
      font-weight: 700;
      color: var(--primary-hover);
    }

    .save-info-divider {
      margin: 0 4px;
      opacity: 0.4;
    }

    .controls-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      background: var(--glass-bg);
      padding: 15px 30px;
      border-radius: 20px;
      border: 1px solid var(--glass-border);
      box-shadow: 0 4px 15px rgba(0,0,0,0.03);
      gap: 16px;
      flex-wrap: wrap;
    }

    .month-selector {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .month-btn {
      background: #e0f2fe;
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      color: var(--primary);
      cursor: pointer;
      transition: all 0.2s;
    }

    .month-btn:hover:not(:disabled) {
      background: var(--primary);
      color: white;
      transform: scale(1.1);
    }

    .month-btn:disabled { opacity: 0.35; cursor: not-allowed; }

    .current-month-display {
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--primary);
      min-width: 130px;
      text-align: center;
    }

    .month-stats {
      font-size: 0.95rem;
      color: var(--text-muted);
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .month-stats-count {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--primary);
    }

    .manager-legend {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .re-upload-btn {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      border: none;
      border-radius: 30px;
      padding: 12px 28px;
      color: white;
      font-weight: 600;
      cursor: pointer;
      font-size: 1rem;
      font-family: inherit;
      transition: transform 0.2s, box-shadow 0.2s;
      white-space: nowrap;
    }

    .re-upload-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(6, 182, 212, 0.3);
    }

    /* 내보내기 버튼 */
    .export-btn {
      background: #ffffff;
      border: 2px solid var(--primary);
      border-radius: 30px;
      padding: 10px 22px;
      color: var(--primary);
      font-weight: 600;
      cursor: pointer;
      font-size: 1rem;
      font-family: inherit;
      transition: all 0.2s;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .export-btn:hover {
      background: var(--primary);
      color: white;
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(2, 132, 199, 0.2);
    }

    .export-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }

    /* ── Calendar ── */
    .calendar-container {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 15px;
      width: 100%;
    }

    .calendar-header-cell {
      text-align: center;
      font-weight: 700;
      font-size: 1.1rem;
      padding: 15px;
      color: var(--primary);
      background: rgba(255, 255, 255, 0.8);
      border-radius: 12px;
      border: 1px solid var(--glass-border);
    }

    .calendar-header-cell:nth-child(1) { color: #ef4444; }
    .calendar-header-cell:nth-child(7) { color: #3b82f6; }

    .calendar-cell {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      min-height: 140px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 10px rgba(0,0,0,0.02);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .calendar-cell:not(.empty):hover {
      transform: translateY(-3px);
      box-shadow: var(--glass-shadow);
      border-color: var(--secondary);
    }

    .calendar-cell.empty {
      background: transparent;
      border: 1px dashed rgba(2, 132, 199, 0.1);
      box-shadow: none;
    }

    .calendar-cell.today {
      border: 2px solid var(--primary);
      background: #e0f2fe;
    }

    .calendar-cell.sunday  .cell-date-num { color: #ef4444; }
    .calendar-cell.saturday .cell-date-num { color: #3b82f6; }

    .cell-date {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .cell-date-num { color: var(--text-main); }

    .cell-date-meta {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .today-badge {
      font-size: 0.75rem;
      color: #fff;
      background: var(--primary);
      padding: 4px 8px;
      border-radius: 12px;
      font-weight: bold;
      letter-spacing: 0.5px;
    }

    .count-badge {
      font-size: 0.7rem;
      color: #fff;
      background: var(--accent);
      padding: 2px 7px;
      border-radius: 10px;
      font-weight: 700;
      min-width: 22px;
      text-align: center;
    }

    .cell-content {
      flex-grow: 1;
      overflow-y: auto;
      max-height: 180px;
      padding-right: 4px;
    }

    .cell-content::-webkit-scrollbar { width: 5px; }
    .cell-content::-webkit-scrollbar-track { background: rgba(0,0,0,0.03); border-radius: 10px; }
    .cell-content::-webkit-scrollbar-thumb { background: #bae6fd; border-radius: 10px; }

    .shipment-item {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-left: 4px solid var(--secondary);
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 10px;
      transition: background 0.2s;
      animation: slideIn 0.3s ease-out forwards;
      opacity: 0;
      cursor: default;
    }

    .shipment-item:last-child { margin-bottom: 0; }
    .shipment-item:hover { background: #f8fafc; }

    .ship-po {
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--primary-hover);
      margin-bottom: 4px;
      word-break: break-all;
    }

    .ship-enduser {
      font-size: 0.85rem;
      color: var(--text-muted);
      display: flex;
      align-items: flex-start;
      margin-top: 2px;
    }

    /* ── v1.5.0 특별 관리대상 ── */
    :root {
      --warn: #ea580c;
      --warn-soft: #fff7ed;
      --warn-border: #fdba74;
    }

    .compare-info { color: var(--text-muted); }
    .compare-info strong { color: var(--warn); font-weight: 700; }

    .compare-btn {
      margin-left: auto;
      background: transparent;
      border: 1px solid var(--glass-border);
      border-radius: 10px;
      padding: 4px 12px;
      font-size: 0.8rem;
      font-family: inherit;
      font-weight: 600;
      color: var(--primary);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .compare-btn:hover { background: var(--primary); color: #fff; }

    .watch-panel {
      background: var(--warn-soft);
      border: 1px solid var(--warn-border);
      border-left: 5px solid var(--warn);
      border-radius: 16px;
      margin-bottom: 20px;
      overflow: hidden;
    }

    .watch-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 22px;
      cursor: pointer;
      user-select: none;
    }

    .watch-title {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--warn);
    }

    .watch-count {
      background: var(--warn);
      color: #fff;
      font-size: 0.8rem;
      font-weight: 700;
      padding: 2px 10px;
      border-radius: 12px;
    }

    .watch-desc {
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    .watch-toggle {
      margin-left: auto;
      color: var(--warn);
      transition: transform 0.2s;
    }
    .watch-panel.collapsed .watch-toggle { transform: rotate(-90deg); }
    .watch-panel.collapsed .watch-body { display: none; }

    .watch-body {
      padding: 0 22px 18px;
      max-height: 360px;
      overflow-y: auto;
    }

    .watch-empty {
      font-size: 0.9rem;
      color: var(--text-muted);
      padding: 4px 0 2px;
    }

    .watch-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.88rem;
      background: #fff;
      border-radius: 10px;
      overflow: hidden;
    }

    .watch-table th {
      text-align: left;
      background: #ffedd5;
      color: #9a3412;
      font-weight: 700;
      padding: 9px 12px;
      white-space: nowrap;
      position: sticky;
      top: 0;
    }

    .watch-table td {
      padding: 9px 12px;
      border-top: 1px solid #fde7d3;
      vertical-align: middle;
    }

    .watch-table tr:hover td { background: #fffaf5; }

    .watch-po { font-weight: 800; color: var(--primary-hover); }

    .watch-mgr {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-weight: 600;
    }

    .watch-date-old { color: var(--text-muted); text-decoration: line-through; }
    .watch-arrow { color: var(--warn); margin: 0 6px; font-weight: 700; }
    .watch-date-new { font-weight: 700; color: var(--text-main); }

    .delay-tag {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 8px;
      background: var(--warn);
      color: #fff;
      white-space: nowrap;
    }
    .delay-tag.removed { background: #64748b; }
    .delay-tag.overdue { background: #dc2626; }

    .shipment-item.flagged.overdue {
      background: #fef2f2;
      border-color: #fca5a5;
      box-shadow: 0 0 0 1px #fca5a5;
    }
    .shipment-item.flagged.overdue .flag-chip {
      color: #dc2626;
    }

    .watch-jump {
      background: none;
      border: none;
      color: var(--primary);
      font-family: inherit;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: underline;
    }

    /* 캘린더 내 특별관리 아이템 */
    .shipment-item.flagged {
      background: var(--warn-soft);
      border-color: var(--warn-border);
      box-shadow: 0 0 0 1px var(--warn-border);
    }

    .flag-chip {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--warn);
      margin-top: 5px;
    }

    .calendar-cell.pulse { animation: pulse 1.2s ease-out 2; }

    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0 rgba(234, 88, 12, 0.5); }
      100% { box-shadow: 0 0 0 14px rgba(234, 88, 12, 0); }
    }

    /* ── Toast 알림 ── */
    .toast {
      position: fixed;
      bottom: 60px;
      right: 20px;
      background: var(--primary);
      color: white;
      font-weight: 600;
      font-size: 0.9rem;
      padding: 12px 20px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(2, 132, 199, 0.3);
      display: flex;
      align-items: center;
      gap: 8px;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.3s ease, transform 0.3s ease;
      pointer-events: none;
      z-index: 1000;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* Version Label */
    .version-label {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: var(--glass-bg);
      color: var(--primary);
      font-weight: 700;
      padding: 8px 16px;
      border-radius: 20px;
      border: 1px solid var(--glass-border);
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateX(-5px); }
      to   { opacity: 1; transform: translateX(0); }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1 class="title">2026년 월별 선적 일정 대시보드</h1>
    </div>

    <!-- 업로드 폼 -->
    <div class="dropzone-container" id="dropzoneContainer">
      <!--
        ✅ v1.3.1 구조 변경: <label> → <div> + JS click 이벤트
        label(inline)이 내부 div(block)를 포함하면 border가 두 조각으로
        분리 렌더링되는 HTML 스펙 이슈를 근본적으로 해결.
      -->
      <div class="dropzone" id="dropZone">
        <div class="dropzone-icon">
          <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="17 8 12 3 7 8"></polyline>
            <line x1="12" y1="3" x2="12" y2="15"></line>
          </svg>
        </div>
        <div class="dropzone-text">CSV 파일을 드래그하거나 여기를 클릭하세요.</div>
        <div class="dropzone-subtext">ENG + T&M 동시 선택 가능 (PO#, End User, 담당자, 선적일 항목 필요)</div>
      </div>
      <!-- multiple: ENG + T&M 동시 선택 지원 -->
      <input type="file" id="fileInput" accept=".csv" multiple style="display:none" />

      <!-- 저장된 데이터 힌트 — JS로 제어 -->
      <div class="cached-hint" id="cachedHint" style="display:none">
        <div class="cached-hint-info">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
            <polyline points="17 21 17 13 7 13 7 21"></polyline>
            <polyline points="7 3 7 8 15 8"></polyline>
          </svg>
          <div>
            <div class="cached-hint-name" id="cachedFileName">—</div>
            <div class="cached-hint-date" id="cachedFileDate">—</div>
          </div>
        </div>
        <button class="load-cached-btn" onclick="loadCachedData()">저장 데이터 열기</button>
      </div>
    </div>

    <!-- 대시보드 화면 -->
    <!-- ⚠️ style="display:none" — FOUC 방지: 인라인 스타일로 파싱 즉시 숨김 처리 -->
    <div class="dashboard-wrapper" id="dashboardWrapper" style="display:none">

      <!-- 저장 정보 표시줄 -->
      <div class="save-info-bar" id="saveInfoBar" style="display:none">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
          <polyline points="17 21 17 13 7 13 7 21"></polyline>
          <polyline points="7 3 7 8 15 8"></polyline>
        </svg>
        <span>자동 저장된 데이터</span>
        <span class="save-info-divider">·</span>
        <span class="save-info-filename" id="saveInfoName">—</span>
        <span class="save-info-divider">·</span>
        <span id="saveInfoDate">—</span>
        <span class="save-info-divider">|</span>
        <span class="compare-info" id="compareInfo">비교 기준 없음</span>
        <button class="compare-btn" onclick="compareInput.click()" title="지난주 CSV를 직접 골라 비교 기준으로 지정 (ENG + T&M 동시 선택 가능)">비교 파일 선택</button>
        <input type="file" id="compareInput" accept=".csv" multiple style="display:none" />

      <!-- v1.5.0 특별 관리대상 패널 -->
      <div class="watch-panel" id="watchPanel" style="display:none">
        <div class="watch-header" onclick="toggleWatchPanel()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--warn)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
            <line x1="12" y1="9" x2="12" y2="13"></line>
            <line x1="12" y1="17" x2="12.01" y2="17"></line>
          </svg>
          <span class="watch-title">특별 관리대상</span>
          <span class="watch-count" id="watchCount">0</span>
          <span class="watch-desc" id="watchDesc">지난 데이터 대비 선적일이 뒤로 밀린 건</span>
          <svg class="watch-toggle" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>

        <div class="watch-body" id="watchBody"></div>

      <div class="controls-row">
        <div class="month-selector">
          <button class="month-btn" id="prevMonthBtn" onclick="changeMonth(-1)" title="이전 달">◀</button>
          <div class="current-month-display" id="monthDisplay">2026년 4월</div>
          <button class="month-btn" id="nextMonthBtn" onclick="changeMonth(1)" title="다음 달">▶</button>
        </div>

        <div class="month-stats" id="monthStats">
          이번 달 선적 <span class="month-stats-count" id="monthCount">0</span>건
        </div>

        <div class="manager-legend" id="managerLegend"></div>

        <div class="btn-group">
          <button class="export-btn" id="exportBtn" onclick="exportToXlsx()" title="오늘 기준 과거 1주~미래 3주 선적 일정 xlsx 다운로드">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="7 10 12 15 17 10"></polyline>
              <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
            4주 일정 내보내기

      <div class="calendar-container" id="calendarGrid"></div>

  </div>

  <!-- Toast 알림 -->
  <div class="toast" id="toast">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="20 6 9 17 4 12"></polyline>
    </svg>
    <span id="toastMsg">저장 완료</span>
  </div>

  <div class="version-label">v1.6.0</div>

  <script>
    // ─── Constants ────────────────────────────────────────────
    const TARGET_YEAR    = 2026;
    const WEEKS          = ['일', '월', '화', '수', '목', '금', '토'];
    const STORAGE_KEY    = 'shipDashboard_v1'; // localStorage 키
    const PREV_STORAGE_KEY = 'shipDashboard_prev_v1'; // v1.5.0 비교 기준(직전) 스냅샷
    const WATCH_LOOKBACK_DAYS = 14; // 이번 주 시작 기준 몇 일 전까지의 '이전 선적일'을 감시할지
    const OVERDUE_DAYS        = 7;  // v1.6.0: 선적 후 7일 경과 시 미입고 경고
    const OVERDUE_EXCLUDE_STATUS = ['오더 클로징', '입고완료'];
    const OVERDUE_EXCLUDE_TYPE   = ['재고납품', '수리'];

    const MANAGER_COLOR_MAP = {
      // ── ENG 부서 ──────────────────────────────
      'WK':  '#0284c7',  // 파랑
      'CHK': '#d97706',  // 앰버
      'SM':  '#7c3aed',  // 보라
      'TK':  '#059669',  // 에메랄드
      'CHY': '#e11d48',  // 로즈
      'HJ':  '#0891b2',  // 시안
      'YK':  '#65a30d',  // 라임
      'KW':  '#f97316',  // 오렌지
      // ── T&M 부서 ──────────────────────────────
      'AD':  '#6366f1',  // 인디고
      'BS':  '#14b8a6',  // 틸
      'MS':  '#db2777',  // 핑크
      'DK':  '#b45309',  // 다크 앰버
      'SI':  '#9333ea',  // 바이올렛
      'TU':  '#0f766e',  // 다크 틸
      'SS':  '#dc2626',  // 레드
    };
    const DEFAULT_COLOR = '#94a3b8';

    function getManagerColor(manager) {
      if (!manager) return DEFAULT_COLOR;
      return MANAGER_COLOR_MAP[manager.trim().toUpperCase()] || DEFAULT_COLOR;
    }

    // ─── State ────────────────────────────────────────────────
    let globalData    = [];
    let currentMonth  = new Date().getMonth();

    // ─── DOM ──────────────────────────────────────────────────
    const dropZone          = document.getElementById('dropZone');
    const fileInput         = document.getElementById('fileInput');
    const dropzoneContainer = document.getElementById('dropzoneContainer');
    const dashboardWrapper  = document.getElementById('dashboardWrapper');
    const calendarGrid      = document.getElementById('calendarGrid');
    const monthDisplay      = document.getElementById('monthDisplay');
    const monthCount        = document.getElementById('monthCount');
    const managerLegend     = document.getElementById('managerLegend');
    const prevMonthBtn      = document.getElementById('prevMonthBtn');
    const nextMonthBtn      = document.getElementById('nextMonthBtn');
    const cachedHint        = document.getElementById('cachedHint');
    const cachedFileName    = document.getElementById('cachedFileName');
    const cachedFileDate    = document.getElementById('cachedFileDate');
    const saveInfoBar       = document.getElementById('saveInfoBar');
    const saveInfoName      = document.getElementById('saveInfoName');
    const saveInfoDate      = document.getElementById('saveInfoDate');
    const toast             = document.getElementById('toast');
    const toastMsg          = document.getElementById('toastMsg');
    const compareInput      = document.getElementById('compareInput');
    const compareInfo       = document.getElementById('compareInfo');
    const watchPanel        = document.getElementById('watchPanel');
    const watchCount        = document.getElementById('watchCount');
    const watchDesc         = document.getElementById('watchDesc');
    const watchBody         = document.getElementById('watchBody');

    // ─── localStorage ─────────────────────────────────────────
    function saveToStorage(data, fileName) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          data:    data,
          fileName: fileName,
          savedAt: new Date().toISOString()
        }));
      } catch (e) {
        // 용량 초과 등 — 조용히 무시
        console.warn('localStorage 저장 실패:', e);
      }
    }

    function loadFromStorage() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return null;
        return JSON.parse(raw);
      } catch (e) {
        return null;
      }
    }

    function clearStorage() {
      localStorage.removeItem(STORAGE_KEY);
    }

    // 날짜 포맷: "2026-04-21 10:30 저장"
    function formatSavedAt(isoString) {
      const d = new Date(isoString);
      const yy = d.getFullYear();
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      const hh = String(d.getHours()).padStart(2, '0');
      const mi = String(d.getMinutes()).padStart(2, '0');
      return `${yy}-${mm}-${dd} ${hh}:${mi} 저장`;
    }

    // ─── Toast ────────────────────────────────────────────────
    let toastTimer = null;
    function showToast(msg) {
      toastMsg.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 2500);
    }

    // ─── 저장 정보 UI 업데이트 ────────────────────────────────
    function updateSaveInfoBar(fileName, savedAt) {
      saveInfoName.textContent = fileName || '—';
      saveInfoDate.textContent = savedAt ? formatSavedAt(savedAt) : '—';
      saveInfoBar.style.display = 'flex';
    }

    function hideSaveInfoBar() {
      saveInfoBar.style.display = 'none';
    }

    // ─── 업로드 화면 캐시 힌트 ───────────────────────────────
    function checkAndShowCachedHint() {
      const saved = loadFromStorage();
      if (saved && saved.data && saved.data.length > 0) {
        cachedFileName.textContent = saved.fileName || '저장된 파일';
        cachedFileDate.textContent = formatSavedAt(saved.savedAt);
        cachedHint.style.display = 'flex';
      } else {
        cachedHint.style.display = 'none';
      }
    }

    function loadCachedData() {
      const saved = loadFromStorage();
      if (!saved || !saved.data) return;
      globalData = saved.data;
      refreshDetection();
      renderCalendar();
      updateSaveInfoBar(saved.fileName, saved.savedAt);
    }

    // ─── Drag and Drop ───────────────────────────────────────
    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(ev => {
      dropZone.addEventListener(ev, e => { e.preventDefault(); e.stopPropagation(); }, false);
    });
    ['dragenter', 'dragover'].forEach(ev => {
      dropZone.addEventListener(ev, () => dropZone.classList.add('dragover'), false);
    });
    ['dragleave', 'drop'].forEach(ev => {
      dropZone.addEventListener(ev, () => dropZone.classList.remove('dragover'), false);
    });
    dropZone.addEventListener('drop', e => {
      if (e.dataTransfer.files.length) handleFiles(e.dataTransfer.files);
    });
    dropZone.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', e => {
      if (e.target.files.length) handleFiles(e.target.files);
    });

    // ─── App Control ─────────────────────────────────────────
    function showDashboard() {
      dropzoneContainer.style.display = 'none';
      dashboardWrapper.classList.remove('fade-in');
      dashboardWrapper.style.display = 'block';
      void dashboardWrapper.offsetWidth; // reflow → 애니메이션 재시작
      dashboardWrapper.classList.add('fade-in');
    }

    function resetApp() {
      // localStorage는 유지 — 다음 접속 시 자동 로드 가능하도록
      fileInput.value = '';
      globalData = [];
      dashboardWrapper.classList.remove('fade-in');
      dashboardWrapper.style.display = 'none';
      dropzoneContainer.style.display = 'block';
      calendarGrid.innerHTML = '';
      managerLegend.innerHTML = '';
      monthCount.textContent = '0';
      hideSaveInfoBar();
      currentMonth = new Date().getMonth();
      checkAndShowCachedHint(); // 캐시 힌트 다시 표시
    }

    // ─── 파일 업로드 (단일/다중 통합) ───────────────────────
    // 부서 추정: 파일명에 'T&M' 또는 'TM' 포함 여부
    function guessDept(fileName) {
      return /T&M|TM/i.test(fileName) ? 'T&M' : 'ENG';
    }

    // 여러 CSV를 파싱·병합 후 callback(mergedData, combinedName)
    function parseCsvFiles(fileList, callback) {
      const csvFiles = Array.from(fileList).filter(f => f.name.toLowerCase().endsWith('.csv'));
      if (csvFiles.length === 0) {
        alert("CSV 파일만 업로드 가능합니다.");
        return;
      }

      let mergedData  = [];
      let loadedCount = 0;
      const fileNames = [];

      csvFiles.forEach(file => {
        Papa.parse(file, {
          header: true,
          skipEmptyLines: true,
          complete: results => {
            const dept = guessDept(file.name);
            // 각 행에 출처 파일명·부서 태깅
            const tagged = results.data.map(row => ({
              ...row,
              _sourceFile: file.name,
              _dept: dept
            }));
            mergedData = mergedData.concat(tagged);
            fileNames.push(file.name);
            loadedCount++;

            if (loadedCount === csvFiles.length) {
              callback(mergedData, fileNames.join(' + '), csvFiles.length);
            }
          },
          error: err => alert(`파싱 에러 (${file.name}): ${err.message}`)
        });
      });
    }

    function handleFiles(fileList) {
      parseCsvFiles(fileList, (mergedData, combinedName, fileCount) => {
        // v1.5.0: 기존 저장 데이터를 '비교 기준'으로 이동
        //  - 같은 날 다시 올린 경우(수정 재업로드)는 비교 기준을 유지 → 같은 주 데이터끼리 비교되는 것 방지
        const existing = loadFromStorage();
        let rotated = false;
        if (existing && existing.data && existing.data.length > 0 && !isSameDay(existing.savedAt, new Date().toISOString())) {
          savePrevSnapshot(existing.data, existing.fileName, existing.savedAt);
          rotated = true;
        }

        globalData = mergedData;
        saveToStorage(globalData, combinedName);
        refreshDetection();
        renderCalendar();
        updateSaveInfoBar(combinedName, new Date().toISOString());
        const label = fileCount > 1 ? `${fileCount}개 파일 통합 완료` : '저장 완료';
        showToast(`${label} · ${globalData.length}건${rotated ? ' · 이전 데이터를 비교 기준으로 보관' : ''}`);
      });
    }

    // ─── v1.5.0 비교 기준 스냅샷 ─────────────────────────────
    // 용량 절약: 비교에 필요한 컬럼만 저장
    const SNAPSHOT_FIELDS = ['*ID', 'PO#', 'Model No', 'End User', '담당자', 'MAKER', '선적일', '_dept'];

    function slimRows(rows) {
      return rows.map(r => {
        const o = {};
        SNAPSHOT_FIELDS.forEach(k => { if (r[k] !== undefined && r[k] !== '') o[k] = r[k]; });
        return o;
      });
    }

    let prevSnapshot = null;   // { data, fileName, savedAt }
    let watchList    = [];     // 감지 결과
    let flaggedMap   = {};     // key|YYYY-MM-DD → watch item (캘린더 표시용)

    function savePrevSnapshot(data, fileName, savedAt) {
      prevSnapshot = { data: slimRows(data), fileName, savedAt };
      try {
        localStorage.setItem(PREV_STORAGE_KEY, JSON.stringify(prevSnapshot));
      } catch (e) {
        console.warn('비교 기준 저장 실패:', e);
      }
    }

    function loadPrevSnapshot() {
      try {
        const raw = localStorage.getItem(PREV_STORAGE_KEY);
        prevSnapshot = raw ? JSON.parse(raw) : null;
      } catch (e) {
        prevSnapshot = null;
      }
    }

    function isSameDay(isoA, isoB) {
      if (!isoA || !isoB) return false;
      return formatDateYMD(new Date(isoA)) === formatDateYMD(new Date(isoB));
    }

    // 수동 비교 파일 지정
    compareInput.addEventListener('change', e => {
      if (!e.target.files.length) return;
      parseCsvFiles(e.target.files, (mergedData, combinedName) => {
        // 파일 수정일을 기준일로 사용 (없으면 현재 시각)
        const lm = Array.from(e.target.files).map(f => f.lastModified || 0);
        const savedAt = new Date(Math.max(...lm) || Date.now()).toISOString();
        savePrevSnapshot(mergedData, combinedName, savedAt);
        compareInput.value = '';
        refreshDetection();
        renderCalendar();
        showToast(`비교 기준 지정 완료 · 특별 관리대상 ${watchList.length}건`);
      });
    });

    // 행 매칭 키: *ID(따옴표 제거) 우선, 없으면 PO# + Model No
    function rowKey(row) {
      const dept = row['_dept'] || 'ENG';
      const id = (row['*ID'] || '').replace(/["'\s]/g, '');
      if (id) return `${dept}|ID:${id}`;
      const po = (row['PO#'] || '').trim();
      const model = (row['Model No'] || '').trim();
      return po ? `${dept}|PO:${po}|${model}` : null;
    }

    // 이번 주 월요일 00:00 (KST 로컬 기준)
    function getWeekStart(base) {
      const d = new Date(base);
      d.setHours(0, 0, 0, 0);
      const offset = (d.getDay() + 6) % 7; // 월=0 … 일=6
      d.setDate(d.getDate() - offset);
      return d;
    }

    function fmtMD(d) { return `${d.getMonth() + 1}/${d.getDate()}`; }

    /**
     * 판정 규칙 (v1.5.0):
     *  1) 이전 스냅샷 선적일 P가 [이번 주 월요일 - LOOKBACK, 이번 주 일요일] 범위 → "지났거나 이번 주였던" 날짜
     *  2) P가 현재 선적일 목록에 더 이상 없음
     *  3) 현재 선적일 중 P보다 늦고 이번 주 월요일 이후인 날짜 C가 있음 → 지연(+N일)
     *     현재 선적일이 아예 없으면 → "선적일 삭제됨"
     */
    function detectDelayedShipments(prevRows, currRows, today = new Date()) {
      const weekStart = getWeekStart(today);
      const weekEnd   = new Date(weekStart); weekEnd.setDate(weekStart.getDate() + 6);
      const lookStart = new Date(weekStart); lookStart.setDate(weekStart.getDate() - WATCH_LOOKBACK_DAYS);

      const currMap = {};
      currRows.forEach(r => { const k = rowKey(r); if (k) currMap[k] = r; });

      const results = [];
      const seen = new Set();

      prevRows.forEach(prev => {
        const key = rowKey(prev);
        if (!key || seen.has(key)) return;
        const curr = currMap[key];
        if (!curr) return; // 현재 파일에 없는 행(삭제/클로징)은 제외

        const prevDates = parseShippingDates(prev['선적일'] || '');
        const currDates = parseShippingDates(curr['선적일'] || '');
        const currYMD   = new Set(currDates.map(formatDateYMD));

        // 감시 범위 안에 있고, 현재 목록에서 사라진 이전 날짜
        const moved = prevDates
          .filter(p => p >= lookStart && p <= weekEnd && !currYMD.has(formatDateYMD(p)))
          .sort((a, b) => a - b);
        if (moved.length === 0) return;

        const base = {
          key,
          dept:    curr['_dept'] || 'ENG',
          po:      (curr['PO#'] || '').trim(),
          endUser: (curr['End User'] || '').trim() || 'N/A',
          manager: (curr['담당자'] || '').trim(),
          maker:   (curr['MAKER'] || '').trim(),
          model:   (curr['Model No'] || '').trim(),
          prevRaw: (prev['선적일'] || '').trim(),
          currRaw: (curr['선적일'] || '').trim(),
        };

        if (currDates.length === 0) {
          results.push({ ...base, prevDate: moved[0], newDate: null, delayDays: null, removed: true });
          seen.add(key);
          return;
        }

        const p = moved[0];
        const c = currDates
          .filter(d => d > p && d >= weekStart)
          .sort((a, b) => a - b)[0];
        if (!c) return; // 앞당겨졌거나 지난 날짜로 정정된 경우는 제외

        results.push({ ...base, prevDate: p, newDate: c, delayDays: Math.round((c - p) / 86400000), removed: false });
        seen.add(key);
      });

      // 새 선적일 → PO# 순 (삭제 건은 맨 뒤)
      results.sort((a, b) => {
        if (a.removed !== b.removed) return a.removed ? 1 : -1;
        return (a.newDate || 0) - (b.newDate || 0) || a.po.localeCompare(b.po);
      });
      return results;
    }

    /**
     * v1.6.0 미입고 지연 감지 (현재 파일 한 장만으로 판정 — 비교 기준 불필요)
     *  - 선적일(2026) 중 가장 이른 날짜가 오늘보다 OVERDUE_DAYS일 이상 지남
     *  - 입고일이 완전히 비어 있음 (납품일이 있으면 이미 전달된 것으로 보고 제외)
     *  - 상태가 '오더 클로징' / '입고완료'이면 제외
     *  - 발주 유형이 '재고납품' / '수리'이면 제외 (입고 절차가 없는 건)
     *  - 분할 선적은 입고일이 하나라도 있으면 정상으로 봄 (v1.6.0 정책)
     */
    function isBlank(v) {
      return !v || !String(v).replace(/[\s,.\-\/"]/g, '');
    }

    function detectOverdueShipments(rows, today = new Date()) {
      const base = new Date(today); base.setHours(0, 0, 0, 0);
      const results = [];
      const seen = new Set();

      rows.forEach(r => {
        const po = (r['PO#'] || '').trim();
        if (!po) return;
        if (!isBlank(r['입고일']) || !isBlank(r['납품일'])) return;
        const status = (r['상태'] || '').trim();
        if (OVERDUE_EXCLUDE_STATUS.includes(status)) return;
        const type = (r['발주 유형'] || '').trim();
        if (OVERDUE_EXCLUDE_TYPE.includes(type)) return;

        const dates = parseShippingDates(r['선적일'] || '').sort((a, b) => a - b);
        if (dates.length === 0) return;
        const shipDate = dates[0];
        const days = Math.round((base - shipDate) / 86400000);
        if (days < OVERDUE_DAYS) return;

        const key = rowKey(r);
        if (!key || seen.has(key)) return;
        seen.add(key);

        results.push({
          type: 'overdue',
          key,
          dept:    r['_dept'] || 'ENG',
          po,
          endUser: (r['End User'] || '').trim() || 'N/A',
          manager: (r['담당자'] || '').trim(),
          maker:   (r['MAKER'] || '').trim(),
          model:   (r['Model No'] || '').trim(),
          status,
          shipDate,
          overdueDays: days,
          currRaw: (r['선적일'] || '').trim(),
        });
      });

      // 오래 방치된 순
      results.sort((a, b) => b.overdueDays - a.overdueDays || a.po.localeCompare(b.po));
      return results;
    }

    function refreshDetection() {
      watchList  = [];
      flaggedMap = {};
      if (globalData.length > 0) {
        const overdue = detectOverdueShipments(globalData);
        const delayed = (prevSnapshot && prevSnapshot.data)
          ? detectDelayedShipments(prevSnapshot.data, globalData).map(w => ({ ...w, type: w.removed ? 'removed' : 'delay' }))
          : [];
        // 미입고(감감무소식)를 맨 위에, 그다음 연기/삭제
        const overdueKeys = new Set(overdue.map(w => w.key));
        watchList = overdue.concat(delayed.filter(w => !overdueKeys.has(w.key)));

        watchList.forEach(w => {
          const d = w.type === 'overdue' ? w.shipDate : w.newDate;
          if (d) flaggedMap[`${w.key}|${formatDateYMD(d)}`] = w;
        });
      }
      renderWatchPanel();
      updateCompareInfo();
    }

    function updateCompareInfo() {
      if (prevSnapshot && prevSnapshot.data) {
        compareInfo.innerHTML = `비교 기준: <strong>${escapeHtml(prevSnapshot.fileName || '이전 데이터')}</strong> · ${formatSavedAt(prevSnapshot.savedAt).replace(' 저장', '')}`;
      } else {
        compareInfo.textContent = '비교 기준 없음 (연기 감지는 다음 업로드부터)';
      }
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
    }

    // 항목 유형별 표시 정보
    function watchTagHtml(w) {
      if (w.type === 'overdue') return `<span class="delay-tag overdue">미입고 ${w.overdueDays}일</span>`;
      if (w.type === 'removed') return `<span class="delay-tag removed">선적일 삭제됨</span>`;
      return `<span class="delay-tag">연기 +${w.delayDays}일</span>`;
    }

    function watchTagText(w) {
      if (w.type === 'overdue') return `미입고 ${w.overdueDays}일`;
      if (w.type === 'removed') return '선적일 삭제됨';
      return `연기 +${w.delayDays}일`;
    }

    // ─── v1.5.0 특별 관리대상 패널 ───────────────────────────
    function toggleWatchPanel() {
      watchPanel.classList.toggle('collapsed');
    }

    function renderWatchPanel() {
      if (globalData.length === 0) {
        watchPanel.style.display = 'none';
        return;
      }
      watchPanel.style.display = 'block';
      watchCount.textContent = watchList.length;

      const nOver  = watchList.filter(w => w.type === 'overdue').length;
      const nDelay = watchList.length - nOver;
      watchDesc.textContent = `선적 후 ${OVERDUE_DAYS}일 이상 미입고 ${nOver}건 · 선적일 연기/삭제 ${nDelay}건`
        + ((prevSnapshot && prevSnapshot.data) ? '' : ' (연기 감지는 비교 기준이 있어야 동작)');

      if (watchList.length === 0) {
        watchBody.innerHTML = `<div class="watch-empty">현재 특별 관리대상이 없습니다.</div>`;
        return;
      }

      let rows = '';
      watchList.forEach((w, i) => {
        const color = getManagerColor(w.manager);
        let dateCell, title;
        if (w.type === 'overdue') {
          dateCell = `<span class="watch-date-new">선적 ${fmtMD(w.shipDate)} (${WEEKS[w.shipDate.getDay()]})</span><span class="watch-arrow">·</span><span class="watch-date-old" style="text-decoration:none">입고일 없음</span>`;
          title = `선적일 원문: ${escapeHtml(w.currRaw)}&#10;상태: ${escapeHtml(w.status || '-')}`;
        } else {
          const newCell = w.type === 'removed'
            ? `<span class="watch-date-new">—</span>`
            : `<span class="watch-date-new">${fmtMD(w.newDate)} (${WEEKS[w.newDate.getDay()]})</span>`;
          dateCell = `<span class="watch-date-old">${fmtMD(w.prevDate)}</span><span class="watch-arrow">→</span>${newCell}`;
          title = `이전 원문: ${escapeHtml(w.prevRaw)}&#10;현재 원문: ${escapeHtml(w.currRaw || '(빈칸)')}`;
        }
        const jump = w.type === 'removed' ? '' : `<button class="watch-jump" onclick="jumpToWatch(${i})">캘린더</button>`;
        rows += `
          <tr title="${title}">
            <td class="watch-po">${escapeHtml(w.po)}</td>
            <td>${escapeHtml(w.endUser)}</td>
            <td><span class="watch-mgr"><svg width="8" height="8" viewBox="0 0 24 24" fill="${color}"><circle cx="12" cy="12" r="10"/></svg>${escapeHtml(w.manager || '-')}</span></td>
            <td>${escapeHtml(w.model)}</td>
            <td>${dateCell}</td>
            <td>${watchTagHtml(w)}</td>
            <td>${jump}</td>
          </tr>`;
      });

      watchBody.innerHTML = `
        <table class="watch-table">
          <thead><tr><th>PO#</th><th>End User</th><th>담당자</th><th>Model No</th><th>선적일</th><th>구분</th><th></th></tr></thead>
          <tbody>${rows}</tbody>
        </table>`;
    }

    function jumpToWatch(idx) {
      const w = watchList[idx];
      const targetDate = w ? (w.type === 'overdue' ? w.shipDate : w.newDate) : null;
      if (!targetDate) return;
      currentMonth = targetDate.getMonth();
      renderCalendar();
      const cell = calendarGrid.querySelector(`[data-day="${targetDate.getDate()}"]`);
      if (cell) {
        cell.scrollIntoView({ behavior: 'smooth', block: 'center' });
        cell.classList.remove('pulse'); void cell.offsetWidth; cell.classList.add('pulse');
      }
    }

    // ─── xlsx 내보내기 ────────────────────────────────────────
    function formatDateYMD(d) {
      const y  = d.getFullYear();
      const m  = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${dd}`;
    }

    function exportToXlsx() {
      if (typeof XLSX === 'undefined') {
        alert('xlsx 라이브러리 로딩 중입니다. 잠시 후 다시 시도하세요.');
        return;
      }
      if (globalData.length === 0) return;

      const today = new Date();
      today.setHours(0, 0, 0, 0);

      const startDate = new Date(today);
      startDate.setDate(today.getDate() - 7);   // 과거 1주

      const endDate = new Date(today);
      endDate.setDate(today.getDate() + 21);     // 미래 3주

      const rows = [];

      globalData.forEach(row => {
        const po          = row['PO#'];
        const endUser     = row['End User'];
        const manager     = row['담당자'];
        const maker       = row['MAKER'];
        const model       = row['Model No'];
        const shipDateRaw = row['선적일'];
        const dept        = row['_dept'] || 'ENG';

        if (!shipDateRaw || !po) return;

        parseShippingDates(shipDateRaw).forEach(parsedDate => {
          parsedDate.setHours(0, 0, 0, 0);
          if (parsedDate < startDate || parsedDate > endDate) return;

          const diffDays = Math.round((parsedDate - today) / 86400000);
          const dLabel   = diffDays === 0 ? 'D-Day'
                         : diffDays > 0   ? `D+${diffDays}`
                         :                  `D${diffDays}`;

          rows.push({
            '부서':         dept,
            '선적일':       formatDateYMD(parsedDate),
            '요일':         WEEKS[parsedDate.getDay()],
            'D-Day':        dLabel,
            'PO#':          po.trim(),
            'End User':     endUser  ? endUser.trim()  : '',
            '담당자':       manager  ? manager.trim()  : '',
            'MAKER':        maker    ? maker.trim()    : '',
            'Model No':     model    ? model.trim()    : '',
            '원본 선적일':  shipDateRaw.trim()
          });
        });
      });

      // 날짜 → D-Day → PO# 순 정렬
      rows.sort((a, b) =>
        a['선적일'].localeCompare(b['선적일']) ||
        a['PO#'].localeCompare(b['PO#'])
      );

      if (rows.length === 0) {
        alert(`해당 기간(${formatDateYMD(startDate)} ~ ${formatDateYMD(endDate)}) 내 선적 일정이 없습니다.`);
        return;
      }

      // ── SheetJS 생성 ──
      const ws = XLSX.utils.json_to_sheet(rows);

      // 컬럼 너비 설정
      ws['!cols'] = [
        { wch: 6  }, // 부서
        { wch: 12 }, // 선적일
        { wch: 4  }, // 요일
        { wch: 7  }, // D-Day
        { wch: 18 }, // PO#
        { wch: 22 }, // End User
        { wch: 7  }, // 담당자
        { wch: 10 }, // MAKER
        { wch: 22 }, // Model No
        { wch: 20 }, // 원본 선적일
      ];

      // 범위 정보를 시트 이름에 포함
      const sheetName = `${formatDateYMD(startDate).slice(5)}~${formatDateYMD(endDate).slice(5)}`;
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, sheetName);

      // v1.6.0: 특별관리 시트 (미입고 지연 + 선적일 연기/삭제)
      if (watchList.length > 0) {
        const watchRows = watchList.map(w => {
          const isOverdue = w.type === 'overdue';
          return {
            '부서':          w.dept,
            'PO#':           w.po,
            'End User':      w.endUser,
            '담당자':        w.manager,
            'MAKER':         w.maker,
            'Model No':      w.model,
            '선적일':        formatDateYMD(isOverdue ? w.shipDate : w.prevDate),
            '현재/변경일':   isOverdue ? '입고일 없음' : (w.newDate ? formatDateYMD(w.newDate) : '삭제됨'),
            '구분':          watchTagText(w),
            '상태':          w.status || '',
            '선적일 원문':   w.currRaw || w.prevRaw || ''
          };
        });
        const ws2 = XLSX.utils.json_to_sheet(watchRows);
        ws2['!cols'] = [
          { wch: 6 }, { wch: 18 }, { wch: 22 }, { wch: 7 }, { wch: 10 }, { wch: 22 },
          { wch: 12 }, { wch: 14 }, { wch: 14 }, { wch: 14 }, { wch: 22 }
        ];
        XLSX.utils.book_append_sheet(wb, ws2, '특별관리');
      }

      const fileName = `선적일정_${formatDateYMD(today)}.xlsx`;
      XLSX.writeFile(wb, fileName);
      showToast(`다운로드 완료 · ${rows.length}건 (${sheetName})${watchList.length ? ` · 특별관리 ${watchList.length}건` : ''}`);
    }

    // ─── Date Parsing ─────────────────────────────────────────
    // 연도 해석 규칙:
    //   연도 미기재 (예: "12/31", "1/15")      → TARGET_YEAR(2026) 강제 적용
    //   연도 명시 + 2026년 (예: "26/12/31")   → 포함
    //   연도 명시 + 2026년 아님 (예: "25/12/31") → 제외 (과거/미래 날짜)
    function parseShippingDates(dateString) {
      const regex = /(?:(\d{2,4})[\/\-\.])?\s*(\d{1,2})\s*[\/\-\.]\s*(\d{1,2})/g;
      const dates = [];
      let match;
      while ((match = regex.exec(dateString)) !== null) {
        let year = TARGET_YEAR; // 기본값: 연도 미기재 시 2026 강제

        // 연도가 명시된 경우 → 실제 연도를 확인
        if (match[1] !== undefined) {
          const rawYear = parseInt(match[1], 10);
          year = rawYear < 100 ? 2000 + rawYear : rawYear; // 2자리(25→2025) or 4자리(2025)

          // 2026년이 아니면 이 날짜는 건너뜀
          if (year !== TARGET_YEAR) continue;
        }

        const month = parseInt(match[2], 10);
        const day   = parseInt(match[3], 10);

        if (!isNaN(month) && !isNaN(day) && month >= 1 && month <= 12 && day >= 1 && day <= 31) {
          dates.push(new Date(year, month - 1, day));
        }
      }
      return dates;
    }

    // ─── Month Navigation ────────────────────────────────────
    function changeMonth(delta) {
      if (globalData.length === 0) return;
      currentMonth = Math.max(0, Math.min(11, currentMonth + delta));
      renderCalendar();
    }

    function updateNavButtons() {
      prevMonthBtn.disabled = (currentMonth === 0);
      nextMonthBtn.disabled = (currentMonth === 11);
    }

    // ─── Calendar Renderer ───────────────────────────────────
    function renderCalendar() {
      showDashboard();
      monthDisplay.textContent = `${TARGET_YEAR}년 ${currentMonth + 1}월`;
      updateNavButtons();

      const firstDayOfMonth = new Date(TARGET_YEAR, currentMonth, 1).getDay();
      const daysInMonth     = new Date(TARGET_YEAR, currentMonth + 1, 0).getDate();
      const today           = new Date();

      const monthSchedule = {};
      for (let i = 1; i <= daysInMonth; i++) monthSchedule[i] = [];

      globalData.forEach(row => {
        const po          = row['PO#'];
        const endUser     = row['End User'];
        const manager     = row['담당자'];
        const shipDateRaw = row['선적일'];
        if (!shipDateRaw || !po) return;

        parseShippingDates(shipDateRaw).forEach(parsedDate => {
          if (parsedDate.getFullYear() === TARGET_YEAR && parsedDate.getMonth() === currentMonth) {
            const day = parsedDate.getDate();
            if (monthSchedule[day]) {
              const key  = rowKey(row);
              const flag = key ? flaggedMap[`${key}|${formatDateYMD(parsedDate)}`] : null;
              monthSchedule[day].push({
                po:      po.trim(),
                endUser: endUser ? endUser.trim() : 'N/A',
                manager: manager ? manager.trim() : '',
                raw:     shipDateRaw,
                flag:    flag || null
              });
            }
          }
        });
      });

      const totalCount = Object.values(monthSchedule).reduce((sum, arr) => sum + arr.length, 0);
      monthCount.textContent = totalCount;
      renderManagerLegend(monthSchedule);

      let html = '';

      WEEKS.forEach(w => {
        html += `<div class="calendar-header-cell">${w}</div>`;
      });

      for (let i = 0; i < firstDayOfMonth; i++) {
        html += `<div class="calendar-cell empty"></div>`;
      }

      for (let i = 1; i <= daysInMonth; i++) {
        const dateObj    = new Date(TARGET_YEAR, currentMonth, i);
        const dayOfWeek  = dateObj.getDay();
        const isToday    = (today.getFullYear() === TARGET_YEAR && today.getMonth() === currentMonth && today.getDate() === i);
        const shipments  = monthSchedule[i];

        // 특별관리 건을 맨 위로
        shipments.sort((a, b) => (b.flag ? 1 : 0) - (a.flag ? 1 : 0));

        const sundayClass   = dayOfWeek === 0 ? ' sunday'   : '';
        const saturdayClass = dayOfWeek === 6 ? ' saturday' : '';
        const todayClass    = isToday ? ' today' : '';

        const badge      = shipments.length > 0 ? `<span class="count-badge">${shipments.length}</span>` : '';
        const todayBadge = isToday ? `<span class="today-badge">오늘</span>` : '';

        let shipmentsHtml = '';
        shipments.forEach((s, idx) => {
          const color = getManagerColor(s.manager);
          const endUserDisplay = s.manager ? `${s.endUser} / ${s.manager}` : s.endUser;
          const f = s.flag;
          let title = escapeHtml(s.raw);
          let chip = '';
          if (f) {
            let chipText = '';
            if (f.type === 'overdue') {
              title = `[특별 관리: 미입고] 선적 후 ${f.overdueDays}일 경과 (입고일 없음)&#10;선적일: ${fmtMD(f.shipDate)}&#10;상태: ${escapeHtml(f.status || '-')}&#10;원문: ${escapeHtml(s.raw)}`;
              chipText = `미입고 ${f.overdueDays}일 경과`;
            } else if (f.type === 'removed') {
              title = `[특별 관리: 연기/삭제] 이전 선적일 ${fmtMD(f.prevDate)} → 현재 삭제됨&#10;원문: ${escapeHtml(s.raw)}`;
              chipText = `선적일 삭제됨`;
            } else {
              title = `[특별 관리: 연기] 이전 선적일 ${fmtMD(f.prevDate)} → 현재 ${fmtMD(f.newDate)} (+${f.delayDays}일)&#10;원문: ${escapeHtml(s.raw)}`;
              chipText = `${fmtMD(f.prevDate)}에서 +${f.delayDays}일 연기`;
            }
            chip = `<div class="flag-chip">
                 <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
                 ${chipText}
               </div>`;
          }
          const isOverdue = f && f.type === 'overdue';
          shipmentsHtml += `
            <div class="shipment-item${f ? ' flagged' : ''}${isOverdue ? ' overdue' : ''}" style="border-left-color:${color};animation-delay:${idx * 0.03}s" title="${title}">
              <div class="ship-po">${escapeHtml(s.po)}</div>
              <div class="ship-enduser">
                <svg width="8" height="8" viewBox="0 0 24 24" fill="${color}" style="margin-right:6px;flex-shrink:0;margin-top:4px;"><circle cx="12" cy="12" r="10"/></svg>
                <span style="line-height:1.2;">${escapeHtml(endUserDisplay)}</span>
              </div>
              ${chip}
            </div>`;
        });

        html += `
          <div class="calendar-cell${todayClass}${sundayClass}${saturdayClass}" data-day="${i}">
            <div class="cell-date">
              <span class="cell-date-num">${i}</span>
              <span class="cell-date-meta">${todayBadge}${badge}</span>
            </div>
            <div class="cell-content">${shipmentsHtml}</div>
          </div>`;
      }

      calendarGrid.innerHTML = html;
    }

    // ─── Manager Legend ──────────────────────────────────────
    function renderManagerLegend(schedule) {
      const seen = new Set();
      Object.values(schedule).forEach(arr => arr.forEach(s => { if (s.manager) seen.add(s.manager.trim()); }));

      if (seen.size === 0) { managerLegend.innerHTML = ''; return; }

      let html = '';
      seen.forEach(mgr => {
        const color = getManagerColor(mgr);
        html += `<span class="legend-item"><span class="legend-dot" style="background:${color}"></span>${mgr}</span>`;
      });
      managerLegend.innerHTML = html;
    }

    // ─── 페이지 로드: 자동 복원 ──────────────────────────────
    (function init() {
      loadPrevSnapshot();
      const saved = loadFromStorage();
      if (saved && saved.data && saved.data.length > 0) {
        // 저장된 데이터가 있으면 바로 대시보드 오픈
        globalData = saved.data;
        refreshDetection();
        renderCalendar();
        updateSaveInfoBar(saved.fileName, saved.savedAt);
      } else {
        // 없으면 업로드 화면 유지 (기본값)
        checkAndShowCachedHint();
      }
    })();
  </script>
</body>
